name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: nix develop --no-pure-eval --command cargo fmt --all -- --check
      - run: nix develop --no-pure-eval --command cargo clippy --workspace --all-targets -- -D warnings
      - run: nix develop --no-pure-eval --command cargo test --workspace
      - run: nix develop --no-pure-eval --command cargo package --workspace --no-verify

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --no-pure-eval
