[workspace]
resolver = "2"
members = [
  "crates/clepsydra-core",
  "crates/clepsydra-lib",
  "crates/clepsydra-macros",
]

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.85"
repository   = "https://github.com/LW-54/clepsydra"
license      = "MIT OR Apache-2.0"

[workspace.dependencies]
serde            = { version = "1.0", features = ["derive"] }
toml             = "0.8"
syn              = { version = "2.0", features = ["full", "extra-traits"] }
quote            = "1.0"
proc-macro2      = "1.0"
schemars         = "0.8"
serde_json       = "1.0"
serde_yaml       = "0.9"
proptest         = "1.11"
ndarray          = "0.15"
clepsydra-core   = { version = "0.1.0", path = "crates/clepsydra-core" }
clepsydra-macros = { version = "0.1.0", path = "crates/clepsydra-macros" }

[workspace.lints.clippy]
pedantic                   = { level = "deny", priority = -1 }
nursery                    = { level = "deny", priority = -1 }
unwrap_used                = "deny"
expect_used                = "deny"
indexing_slicing           = "deny"
arithmetic_side_effects    = "deny"
unreachable                = "deny"
unimplemented              = "deny"
unchecked_duration_subtraction = "deny"
todo                       = "deny"
string_slice               = "deny"
panic_in_result_fn         = "deny"
panic                      = "deny"
exit                       = "deny"
as_conversions             = "deny"
