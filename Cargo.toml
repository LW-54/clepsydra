[workspace]
resolver = "2"
members = ["crates/clepsydra-core", "crates/clepsydra-macros"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/LW-54/clepsydra"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
schemars = "0.8"
serde_json = "1.0"
proptest = "1.11"
ndarray = "0.15"
clepsydra-core = { version = "0.1.0", path = "crates/clepsydra-core" }

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
